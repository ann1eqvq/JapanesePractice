<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文動詞變化</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Chart.js 用於繪製圓餅圖 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #F8F9FA;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }
    .custom-primary {
      background-color: #47607D;
    }
    .custom-primary:hover {
      background-color: #384C63;
    }
    .text-brand {
      color: #47607D;
    }
    .border-brand {
      border-color: #47607D;
    }

    /* 答錯時的左右搖晃動畫 */
    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      15%, 45%, 75% { transform: translateX(-7px); }
      30%, 60%, 90% { transform: translateX(7px); }
    }

    /* 答對時的彈跳與放大動畫 */
    @keyframes popSuccess {
      0% { transform: scale(0.92); opacity: 0.6; }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); opacity: 1; }
    }

    .anim-shake {
      animation: shakeCard 0.45s ease-in-out;
      border-color: #F43F5E !important;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.25);
    }

    .anim-success {
      animation: popSuccess 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-color: #10B981 !important;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-8">

  <!-- 頂部頁籤切換導航 -->
  <div class="w-full max-w-xl flex justify-center gap-3 mb-6">
    <button id="tabPracticeBtn" onclick="switchTab('practice')" class="custom-primary text-white px-5 py-2 rounded-xl text-sm font-bold shadow-sm transition">
      練習模式
    </button>
    <button id="tabAnalyticsBtn" onclick="switchTab('analytics')" class="bg-white text-gray-600 border border-gray-200 hover:border-brand px-5 py-2 rounded-xl text-sm font-bold shadow-sm transition">
      錯題分析報告
    </button>
  </div>

  <!-- ==================== 視圖 1：練習頁面 ==================== -->
  <div id="viewPractice" class="w-full max-w-xl flex flex-col items-center">
    
    <!-- 主練習卡片 -->
    <div id="mainPracticeCard" class="w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8 mb-6 transition-all duration-300">
      <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-2">
          <h1 class="text-xl font-bold text-gray-800">日文動詞變化</h1>
          <span id="reviewModeBadge" class="hidden text-xs px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 font-medium">錯題專練中</span>
        </div>
        <div class="text-sm text-gray-500">
          答對數：<span id="score" class="font-bold text-brand">0</span>
        </div>
      </div>

      <!-- 題目單字卡（未答題前不顯示任何分類提示） -->
      <div id="wordDisplayCard" class="text-center py-6 bg-gray-50 rounded-xl mb-6 border border-gray-100 transition-all duration-200">
        <div id="wordDisplay" class="text-3xl font-extrabold text-gray-800 mb-1">食べる</div>
        <div id="readingDisplay" class="text-sm text-gray-500 mb-1">たべる</div>
        <div id="meaningDisplay" class="text-xs text-gray-400">吃</div>
      </div>

      <!-- 步驟 1：選擇類別 -->
      <div id="stepGroup" class="mb-4">
        <p class="text-sm font-medium text-gray-700 mb-3">步驟 1：請選擇動詞類別（快捷鍵 1 / 2 / 3）</p>
        <div class="grid grid-cols-3 gap-3">
          <button onclick="handleGroupSelect(1)" class="py-2.5 px-4 rounded-xl border border-gray-200 hover:border-brand hover:bg-gray-50 font-medium text-sm transition">1類動詞 (1)</button>
          <button onclick="handleGroupSelect(2)" class="py-2.5 px-4 rounded-xl border border-gray-200 hover:border-brand hover:bg-gray-50 font-medium text-sm transition">2類動詞 (2)</button>
          <button onclick="handleGroupSelect(3)" class="py-2.5 px-4 rounded-xl border border-gray-200 hover:border-brand hover:bg-gray-50 font-medium text-sm transition">3類動詞 (3)</button>
        </div>
      </div>

      <!-- 步驟 2：輸入指定形態 -->
      <div id="stepConjugation" class="hidden mb-4">
        <p class="text-sm font-medium text-gray-700 mb-2">
          步驟 2：請輸入該動詞的 <span id="targetFormLabel" class="font-bold text-brand">可能形</span>
        </p>
        <form onsubmit="handleConjugationSubmit(event)" class="flex gap-2">
          <input 
            id="conjugationInput" 
            type="text" 
            placeholder="支援漢字或平假名輸入" 
            class="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-brand text-sm"
            autocomplete="off"
          >
          <button type="submit" class="custom-primary text-white px-5 py-2.5 rounded-xl text-sm font-medium transition">送出</button>
        </form>
      </div>

      <!-- 醒目反饋橫幅 -->
      <div id="feedbackBox" class="hidden rounded-xl p-3 mb-4 text-center text-sm font-semibold transition-all"></div>

      <button id="nextBtn" onclick="nextQuestion()" class="hidden w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-medium transition">
        下一題 (Enter)
      </button>
    </div>

    <!-- 錯題記錄卡 -->
    <div class="w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
        <div class="flex items-center gap-2">
          <h2 class="text-base font-bold text-gray-800">錯題記錄清單</h2>
          <span id="mistakeCountBadge" class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 font-medium">0 題</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="retryMistakesBtn" onclick="toggleMistakeMode()" class="text-xs px-3 py-1 rounded-lg border border-brand text-brand hover:bg-gray-50 transition hidden">
            只練錯題
          </button>
          <button onclick="clearMistakes()" class="text-xs text-gray-400 hover:text-rose-500 transition">
            清空紀錄
          </button>
        </div>
      </div>

      <!-- 匯入 / 匯出資料列 -->
      <div class="flex gap-2 mb-4 pt-2 border-t border-gray-100">
        <button onclick="exportMistakes()" class="text-xs px-3 py-1.5 rounded-lg border border-gray-200 hover:border-brand text-gray-600 transition flex items-center gap-1">
          📥 匯出錯題備份
        </button>
        <button onclick="triggerImport()" class="text-xs px-3 py-1.5 rounded-lg border border-gray-200 hover:border-brand text-gray-600 transition flex items-center gap-1">
          📤 匯入錯題備份
        </button>
        <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="handleFileImport(event)">
      </div>

      <div id="mistakeList" class="space-y-3 text-sm">
        <div id="emptyNote" class="text-center text-gray-400 py-6">目前尚無答錯題目，繼續保持！</div>
      </div>
    </div>
  </div>

  <!-- ==================== 視圖 2：錯題分析報告頁面 ==================== -->
  <div id="viewAnalytics" class="hidden w-full max-w-xl flex flex-col items-center">
    
    <!-- 圓餅圖統計卡片 -->
    <div class="w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
      <h2 class="text-base font-bold text-gray-800 mb-1">錯誤動詞類型分佈</h2>
      <p class="text-xs text-gray-400 mb-4">統計各類動詞（含 カ變、サ變）發生錯誤的佔比</p>
      
      <div id="chartContainer" class="w-full flex justify-center items-center py-2" style="max-height: 260px;">
        <canvas id="typePieChart"></canvas>
      </div>
      <div id="noChartData" class="hidden text-center text-gray-400 py-8 text-sm">
        暫無足夠的錯誤數據生成圖表
      </div>
    </div>

    <!-- 辭書形單字深度分析清單 -->
    <div class="w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-gray-800">單字錯誤深度分析</h2>
        <span id="analyzedWordsCount" class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 font-medium">0 個單字</span>
      </div>

      <div id="analyticsDetailsList" class="space-y-4">
        <!-- 動態渲染每個單字的錯誤歷史與次數 -->
      </div>
    </div>
  </div>

      },
      {
        word: "起きる", reading: "おきる", meaning: "起床", group: 2, subType: "2類動詞",
        forms: {
          "可能形": ["起きられる", "おきられる", "起きれる", "おきれる"],
          "て形": ["起きて", "おきて"],
          "ない形": ["起きない", "おきない"],
          "た形": ["起きた", "おきた"],
          "意向形": ["起きよう", "おきよう"],
          "連體形": ["起きる", "おきる"],
          "ます形": ["起きます", "おきます"],
          "假定形": ["起きれば", "おきれば"],
          "命令形": ["起きろ", "おきろ", "起きよ", "おきよ"]
        }
      },
      {
        word: "寝る", reading: "ねる", meaning: "睡覺", group: 2, subType: "2類動詞",
        forms: {
          "可能形": ["寝られる", "ねられる", "寝れる", "ねれる"],
          "て形": ["寝て", "ねて"],
          "ない形": ["寝ない", "ねない"],
          "た形": ["寝た", "ねた"],
          "意向形": ["寝よう", "ねよう"],
          "連體形": ["寝る", "ねる"],
          "ます形": ["寝ます", "ねます"],
          "假定形": ["寝れば", "ねれば"],
          "命令形": ["寝ろ", "ねろ", "寢よ", "ねよ"]
        }
      },
      {
        word: "教える", reading: "おしえる", meaning: "教導", group: 2, subType: "2類動詞",
        forms: {
          "可能形": ["教えられる", "おしえられる", "教えれる", "おしえれる"],
          "て形": ["教えて", "おしえて"],
          "ない形": ["教えない", "おしえない"],
          "た形": ["教えた", "おしえた"],
          "意向形": ["教えよう", "おしえよう"],
          "連體形": ["教える", "おしえる"],
          "ます形": ["教えます", "おしえます"],
          "假定形": ["教えれば", "おしえれば"],
          "命令形": ["教えろ", "おしえろ", "教えよ", "おしえよ"]
        }
      },

      // ====== 三類動詞（カ變、サ變：題目顯示不提前劇透） ======
      {
        word: "する", reading: "する", meaning: "做", group: 3, subType: "サ變",
        forms: {
          "可能形": ["できる"],
          "て形": ["して"],
          "ない形": ["しない"],
          "た形": ["した"],
          "意向形": ["しよう"],
          "連體形": ["する"],
          "ます形": ["します"],
          "假定形": ["すれば"],
          "命令形": ["しろ", "せよ"]
        }
      },
      {
        word: "来る", reading: "くる", meaning: "來", group: 3, subType: "カ變",
        forms: {
          "可能形": ["こられる", "来られる", "これる", "来れる"],
          "て形": ["きて", "来て"],
          "ない形": ["こない", "来ない"],
          "た形": ["きた", "来た"],
          "意向形": ["こよう", "来よう"],
          "連體形": ["くる", "来る"],
          "ます形": ["きます", "来ます"],
          "假定形": ["くれば", "来れば"],
          "命令形": ["こい", "来い"]
        }
      }
    ];

    const STORAGE_KEY = "jp_verb_master_mistakes_v1";

    let currentVerb = null;
    let targetForm = "";
    let score = 0;
    let isMistakeMode = false;
    let mistakes = [];
    let myChart = null;

    function initApp() {
      loadMistakes();
      renderMistakes();
      nextQuestion();
      setupKeyboard();
    }

    function switchTab(tab) {
      const viewPractice = document.getElementById("viewPractice");
      const viewAnalytics = document.getElementById("viewAnalytics");
      const tabPracticeBtn = document.getElementById("tabPracticeBtn");
      const tabAnalyticsBtn = document.getElementById("tabAnalyticsBtn");

      if (tab === "practice") {
        viewPractice.classList.remove("hidden");
        viewAnalytics.classList.add("hidden");
        tabPracticeBtn.className = "custom-primary text-white px-5 py-2 rounded-xl text-sm font-bold shadow-sm transition";
        tabAnalyticsBtn.className = "bg-white text-gray-600 border border-gray-200 hover:border-brand px-5 py-2 rounded-xl text-sm font-bold shadow-sm transition";
      } else {
        viewPractice.classList.add("hidden");
        viewAnalytics.classList.remove("hidden");
        tabAnalyticsBtn.className = "custom-primary text-white px-5 py-2 rounded-xl text-sm font-bold shadow-sm transition";
        tabPracticeBtn.className = "bg-white text-gray-600 border border-gray-200 hover:border-brand px-5 py-2 rounded-xl text-sm font-bold shadow-sm transition";
        renderAnalytics();
      }
    }

    function loadMistakes() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        mistakes = data ? JSON.parse(data) : [];
      } catch (e) {
        mistakes = [];
      }
    }

    function saveMistakes() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(mistakes));
      } catch (e) {
        console.error("無法寫入 localStorage", e);
      }
    }

    function triggerAnimation(type) {
      const card = document.getElementById("mainPracticeCard");
      card.classList.remove("anim-shake", "anim-success");

      void card.offsetWidth;

      if (type === "success") {
        card.classList.add("anim-success");
      } else {
        card.classList.add("anim-shake");
      }

      setTimeout(() => {
        card.classList.remove("anim-shake", "anim-success");
      }, 600);
    }

    function showFeedback(isSuccess, message) {
      const box = document.getElementById("feedbackBox");
      box.classList.remove("hidden");

      if (isSuccess) {
        box.className = "rounded-xl p-3 mb-4 text-center text-sm font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 transition-all";
        box.innerHTML = `✨ ${message}`;
        triggerAnimation("success");
      } else {
        box.className = "rounded-xl p-3 mb-4 text-center text-sm font-semibold bg-rose-50 text-rose-700 border border-rose-200 transition-all";
        box.innerHTML = `⚠️ ${message}`;
        triggerAnimation("error");
      }
    }

    function nextQuestion() {
      if (isMistakeMode && mistakes.length > 0) {
        const randomItem = mistakes[Math.floor(Math.random() * mistakes.length)];
        currentVerb = verbs.find(v => v.word === randomItem.word) || verbs[0];
        targetForm = randomItem.formKey || "可能形";
      } else {
        if (isMistakeMode && mistakes.length === 0) {
          toggleMistakeMode();
        }
        currentVerb = verbs[Math.floor(Math.random() * verbs.length)];
        const formKeys = Object.keys(currentVerb.forms);
        targetForm = formKeys[Math.floor(Math.random() * formKeys.length)];
      }

      document.getElementById("wordDisplay").textContent = currentVerb.word;
      document.getElementById("readingDisplay").textContent = currentVerb.reading;
      document.getElementById("meaningDisplay").textContent = currentVerb.meaning;
      document.getElementById("targetFormLabel").textContent = targetForm;

      document.getElementById("stepGroup").classList.remove("hidden");
      document.getElementById("stepConjugation").classList.add("hidden");
      document.getElementById("nextBtn").classList.add("hidden");
      document.getElementById("feedbackBox").classList.add("hidden");
      document.getElementById("conjugationInput").value = "";
    }

    function handleGroupSelect(selectedGroup) {
      if (selectedGroup === currentVerb.group) {
        if (currentVerb.isException) {
          showFeedback(true, "分類正確！💡 此單字為「例外1類動詞」（看似2類、實為1類），請接著輸入變形。");
        } else if (currentVerb.group === 3) {
          showFeedback(true, `分類正確！此單字為 3 類動詞（${currentVerb.subType}動詞），請接著輸入變形。`);
        } else {
          showFeedback(true, "分類正確！請接著輸入指定形態。");
        }
        document.getElementById("stepGroup").classList.add("hidden");
        document.getElementById("stepConjugation").classList.remove("hidden");
        document.getElementById("conjugationInput").focus();
      } else {
        if (currentVerb.isException) {
          showFeedback(false, "分類錯誤！💡 這是「例外1類動詞」（外觀看似2類，實為1類）。請依照五段規則繼續輸入變形！");
          recordMistake("分類錯誤", `選了 ${selectedGroup} 類動詞`, `正確為 1 類動詞（例外1類）`, targetForm);
          document.getElementById("stepGroup").classList.add("hidden");
          document.getElementById("stepConjugation").classList.remove("hidden");
          document.getElementById("conjugationInput").focus();
        } else if (currentVerb.group === 3) {
          showFeedback(false, `分類錯誤！這是 3 類動詞（${currentVerb.subType}動詞）。已記錄到錯題本！`);
          recordMistake("分類錯誤", `選了 ${selectedGroup} 類動詞`, `正確為 3 類動詞（${currentVerb.subType}）`, targetForm);
          document.getElementById("nextBtn").classList.remove("hidden");
          document.getElementById("nextBtn").focus();
        } else {
          showFeedback(false, `分類錯誤！這是 ${currentVerb.group} 類動詞。已記錄到錯題本！`);
          recordMistake("分類錯誤", `選了 ${selectedGroup} 類動詞`, `正確為 ${currentVerb.group} 類動詞`, targetForm);
          document.getElementById("nextBtn").classList.remove("hidden");
          document.getElementById("nextBtn").focus();
        }
      }
    }

    function handleConjugationSubmit(e) {
      e.preventDefault();
      const input = document.getElementById("conjugationInput").value.trim();
      const validAnswers = currentVerb.forms[targetForm] || [];

      if (validAnswers.includes(input)) {
        score++;
        document.getElementById("score").textContent = score;

        if (currentVerb.isException) {
          showFeedback(true, "變化完全正確！💡 它是「例外1類」，依五段音便規則變化，掌握得很棒！");
        } else {
          showFeedback(true, "變化完全正確！太厲害了！");
        }

        if (isMistakeMode) {
          mistakes = mistakes.filter(m => !(m.word === currentVerb.word && m.formKey === targetForm));
          saveMistakes();
          renderMistakes();
        }
      } else {
        const hint = currentVerb.isException ? "（💡 它是例外1類動詞，依照五段動詞變形）" : "";
        showFeedback(false, `輸入錯誤！正確答案應為：${validAnswers[0] || "無"} ${hint}`);
        recordMistake(`${targetForm} 變換錯誤`, input || "（空白）", validAnswers[0] || "", targetForm);
      }

      document.getElementById("stepConjugation").classList.add("hidden");
      document.getElementById("nextBtn").classList.remove("hidden");
      document.getElementById("nextBtn").focus();
    }

    function recordMistake(type, userAns, correctAns, formKey) {
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      mistakes.unshift({
        id: Date.now(),
        word: currentVerb.word,
        reading: currentVerb.reading,
        group: currentVerb.group,
        subType: currentVerb.subType,
        type: type,
        formKey: formKey,
        userAns: userAns,
        correctAns: correctAns,
        timestamp: now
      });

      saveMistakes();
      renderMistakes();
    }

    function removeSingleMistake(id) {
      mistakes = mistakes.filter(m => m.id !== id);
      saveMistakes();
      renderMistakes();
      if (isMistakeMode && mistakes.length === 0) {
        toggleMistakeMode();
      }
    }

    function renderMistakes() {
      const list = document.getElementById("mistakeList");
      const retryBtn = document.getElementById("retryMistakesBtn");
      const badge = document.getElementById("mistakeCountBadge");

      badge.textContent = `${mistakes.length} 題`;

      if (mistakes.length === 0) {
        list.innerHTML = `<div id="emptyNote" class="text-center text-gray-400 py-6">目前尚無答錯題目，繼續保持！</div>`;
        retryBtn.classList.add("hidden");
        return;
      }

      retryBtn.classList.remove("hidden");
      list.innerHTML = mistakes.map(m => `
        <div class="p-3.5 bg-gray-50 rounded-xl border border-gray-100 flex flex-col gap-1.5">
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span class="font-bold text-gray-800">${m.word}</span>
              <span class="text-xs text-gray-400">(${m.reading})</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs px-2 py-0.5 rounded-full bg-rose-50 text-rose-600 font-medium">${m.type}</span>
              <button onclick="removeSingleMistake(${m.id})" class="text-gray-300 hover:text-gray-500 text-xs px-1">✕</button>
            </div>
          </div>
          <div class="text-xs text-gray-500 flex items-center gap-2">
            <span>你的回答：<span class="line-through text-rose-500">${m.userAns}</span></span>
            <span class="text-gray-300">|</span>
            <span>正確答案：<span class="font-medium text-emerald-600">${m.correctAns}</span></span>
          </div>
        </div>
      `).join("");
    }

    function clearMistakes() {
      if (confirm("確定要清空瀏覽器中的所有錯題紀錄嗎？")) {
        mistakes = [];
        saveMistakes();
        renderMistakes();
        if (isMistakeMode) toggleMistakeMode();
        if (!document.getElementById("viewAnalytics").classList.contains("hidden")) {
          renderAnalytics();
        }
      }
    }

    function toggleMistakeMode() {
      if (!isMistakeMode && mistakes.length === 0) {
        alert("目前沒有錯題紀錄！");
        return;
      }
      isMistakeMode = !isMistakeMode;
      const retryBtn = document.getElementById("retryMistakesBtn");
      const modeBadge = document.getElementById("reviewModeBadge");

      if (isMistakeMode) {
        retryBtn.textContent = "退出錯題練習";
        retryBtn.className = "text-xs px-3 py-1 rounded-lg bg-amber-500 text-white font-medium transition";
        modeBadge.classList.remove("hidden");
      } else {
        retryBtn.textContent = "只練錯題";
        retryBtn.className = "text-xs px-3 py-1 rounded-lg border border-brand text-brand hover:bg-gray-50 transition";
        modeBadge.classList.add("hidden");
      }
      nextQuestion();
    }

    // ==================== 匯出與匯入功能 ====================
    function exportMistakes() {
      if (mistakes.length === 0) {
        alert("目前沒有錯題紀錄可以匯出！");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mistakes, null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `jp_verb_mistakes_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      document.getElementById("importFileInput").click();
    }

    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (Array.isArray(importedData)) {
            const existingIds = new Set(mistakes.map(m => m.id));
            const newItems = importedData.filter(m => !existingIds.has(m.id));
            mistakes = [...newItems, ...mistakes];
            saveMistakes();
            renderMistakes();
            alert(`成功匯入 ${newItems.length} 筆錯題紀錄！`);
          } else {
            alert("匯入的檔案格式不正確！");
          }
        } catch (err) {
          alert("讀取檔案失敗，請確認檔案格式是否正確。");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    // ==================== 錯題深度分析邏輯 ====================
    function renderAnalytics() {
      const container = document.getElementById("analyticsDetailsList");
      const countBadge = document.getElementById("analyzedWordsCount");
      const noChart = document.getElementById("noChartData");
      const chartCanvas = document.getElementById("typePieChart");

      if (mistakes.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-8 text-sm">目前尚無任何錯題數據可供分析。</div>`;
        countBadge.textContent = "0 個單字";
        noChart.classList.remove("hidden");
        chartCanvas.classList.add("hidden");
        if (myChart) { myChart.destroy(); myChart = null; }
        return;
      }

      noChart.classList.add("hidden");
      chartCanvas.classList.remove("hidden");

      // 1. 動詞類型統計（圓餅圖：全統一為 カ變、サ變）
      const typeCounts = { "1類動詞": 0, "2類動詞": 0, "カ變": 0, "サ變": 0 };
      
      // 2. 單字維度分組統計
      const wordStats = {};

      mistakes.forEach(m => {
        let subType = m.subType;
        if (subType === "KA變") subType = "カ變";
        if (subType === "SA變") subType = "サ變";
        if (!subType) {
          subType = (m.group === 1 ? "1類動詞" : (m.group === 2 ? "2類動詞" : (m.word === "来る" ? "カ變" : "サ變")));
        }

        if (typeCounts[subType] !== undefined) {
          typeCounts[subType]++;
        } else {
          typeCounts[subType] = 1;
        }

        if (!wordStats[m.word]) {
          wordStats[m.word] = {
            word: m.word,
            reading: m.reading,
            groupMistakes: 0,
            formMistakes: {},
            history: []
          };
        }

        if (m.type === "分類錯誤") {
          wordStats[m.word].groupMistakes++;
        } else {
          const formName = m.formKey || "其他變形";
          wordStats[m.word].formMistakes[formName] = (wordStats[m.word].formMistakes[formName] || 0) + 1;
        }

        wordStats[m.word].history.push({
          type: m.type,
          userAns: m.userAns,
          correctAns: correctAnsText(m.correctAns),
          timestamp: m.timestamp || "近期"
        });
      });

      drawPieChart(typeCounts);

      const wordList = Object.values(wordStats);
      countBadge.textContent = `${wordList.length} 個單字`;

      container.innerHTML = wordList.map(item => {
        const formMistakeKeys = Object.keys(item.formMistakes);
        const formTags = formMistakeKeys.length > 0 
          ? formMistakeKeys.map(k => `<span class="bg-amber-50 text-amber-700 px-2 py-0.5 rounded text-xs">${k}: ${item.formMistakes[k]}次</span>`).join(" ")
          : `<span class="text-gray-400 text-xs">無變形錯誤</span>`;

        const historyRows = item.history.map(h => `
          <div class="flex justify-between items-center text-xs py-1 border-b border-gray-100 last:border-0">
            <span class="text-gray-600">${h.type}</span>
            <div class="flex items-center gap-2">
              <span class="line-through text-rose-500">${h.userAns}</span>
              <span class="text-gray-300">➔</span>
              <span class="text-emerald-600 font-medium">${h.correctAns}</span>
            </div>
          </div>
        `).join("");

        return `
          <div class="p-4 bg-gray-50 rounded-xl border border-gray-100">
            <div class="flex justify-between items-start mb-2">
              <div>
                <span class="text-lg font-bold text-gray-800">${item.word}</span>
                <span class="text-xs text-gray-400 ml-1">(${item.reading})</span>
              </div>
              <div class="text-xs">
                分類錯誤：<span class="font-bold text-rose-600">${item.groupMistakes} 次</span>
              </div>
            </div>

            <div class="mb-3">
              <div class="text-xs text-gray-500 mb-1">各變形錯誤統計：</div>
              <div class="flex flex-wrap gap-1.5">
                ${formTags}
              </div>
            </div>

            <div class="bg-white rounded-lg p-3 border border-gray-100">
              <div class="text-xs font-semibold text-gray-500 mb-1.5">錯的答案歷史記錄：</div>
              <div class="flex flex-col">
                ${historyRows}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function correctAnsText(ans) {
      if (!ans) return "無";
      return ans.replace("KA變", "カ變").replace("SA變", "サ變");
    }

    function drawPieChart(typeCounts) {
      const ctx = document.getElementById("typePieChart").getContext("2d");
      const labels = ["1類動詞", "2類動詞", "カ變", "サ變"];
      const dataValues = [
        typeCounts["1類動詞"] || 0,
        typeCounts["2類動詞"] || 0,
        typeCounts["カ變"] || 0,
        typeCounts["サ變"] || 0
      ];

      const total = dataValues.reduce((a, b) => a + b, 0);

      if (myChart) {
        myChart.destroy();
      }

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: [
              '#47607D', // 1類動詞
              '#889BB0', // 2類動詞
              '#D97706', // カ變
              '#059669'  // サ變
            ],
            borderWidth: 2,
            borderColor: '#FFFFFF'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            tooltip: {
              callbacks: {
                label: function(context) {
                  const val = context.raw;
                  const pct = total > 0 ? ((val / total) * 100).toFixed(1) : 0;
                  return ` ${context.label}: ${val}次 (${pct}%)`;
                }
              }
            },
            legend: {
              position: 'bottom',
              labels: {
                boxWidth: 12,
                font: { size: 12 }
              }
            }
          }
        }
      });
    }

    function setupKeyboard() {
      window.addEventListener("keydown", (e) => {
        if (!document.getElementById("viewAnalytics").classList.contains("hidden")) return;

        const stepGroup = document.getElementById("stepGroup");
        const nextBtn = document.getElementById("nextBtn");

        if (!stepGroup.classList.contains("hidden")) {
          if (e.key === "1") handleGroupSelect(1);
          if (e.key === "2") handleGroupSelect(2);
          if (e.key === "3") handleGroupSelect(3);
        }

        if (!nextBtn.classList.contains("hidden") && e.key === "Enter") {
          e.preventDefault();
          nextQuestion();
        }
      });
    }

    initApp();
  </script>
</body>
